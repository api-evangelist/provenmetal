name: Provenmetal
description: >-
  ProvenMetal is a Y Combinator (Summer 2026) startup building fast-turn,
  American-made printed circuit board (PCB) assembly. The company lets customers
  upload a Gerber file, automatically infers the board specification, and returns
  instant quoting for a 7-day standard turnaround with no expedite fees. ProvenMetal
  automates the traditional manufacturing bottlenecks — part procurement, design for
  manufacturability (DFM) review, and assembly — and performs 100% X-ray inspection
  of every board (AI-assisted, cited at 99.8% confidence) before shipment, including
  the inspection data with each order. It is a domestic B2B PCB manufacturing service
  aimed at reshoring electronics production, operated out of San Francisco. As of this
  profile ProvenMetal exposes a customer ordering portal at order.provenmetal.com but
  publishes no public developer API, SDKs, or technical documentation.
